
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex Video AI V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:white;font-family:Arial;padding:16px}
header{text-align:center;color:#8585ff}
.card{background:#20232e;padding:17px;border-radius:16px;margin:16px 0}
video{width:100%;background:#000;border-radius:12px}
button,select,.upload{
 background:#655cf5;color:white;border:0;padding:13px;
 border-radius:10px;font-size:15px;margin:5px 0
}
button{cursor:pointer}
input,select{max-width:100%}
input[type=number],input[type=text]{
 width:100%;padding:12px;border-radius:8px;margin:8px 0
}
input[type=range]{width:100%}
.upload{display:block;text-align:center}
input[type=file]{display:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{background:#303546}
#canvas{display:none}
#status{color:#a6a7ff;text-align:center}
.full{width:100%}
</style>
</head>
<body>

<header>
<h1>🎬 ALEX VIDEO AI V2</h1>
<p>Your Smart Video Editor</p>
</header>

<div class="card">
<h2>📁 Select Video</h2>
<label class="upload">
Choose Video
<input id="file" type="file" accept="video/*">
</label>
<video id="video" controls playsinline></video>
<p id="status">Select a video to start</p>
</div>

<div class="card">
<h2>✂️ Trim Video</h2>
<label>Start Time (seconds)</label>
<input id="start" type="number" value="0" min="0">
<label>End Time (seconds)</label>
<input id="end" type="number" value="0" min="0">
</div>

<div class="card">
<h2>🎨 Filters</h2>
<div class="tools">
<button onclick="setFilter('none')">Normal</button>
<button onclick="setFilter('grayscale(1)')">B&W</button>
<button onclick="setFilter('sepia(1)')">Vintage</button>
<button onclick="setFilter('brightness(1.3)')">Bright</button>
<button onclick="setFilter('contrast(1.4)')">Contrast</button>
<button onclick="setFilter('saturate(1.7)')">Color</button>
</div>
</div>

<div class="card">
<h2>⚡ Video Speed</h2>
<input id="speed" type="range" min="0.5" max="2"
step="0.1" value="1"
oninput="video.playbackRate=Number(this.value);
speedText.textContent='Speed: '+this.value+'x'">
<p id="speedText">Speed: 1x</p>
</div>

<div class="card">
<h2>📝 Text Overlay</h2>
<input id="caption" type="text" placeholder="Write your text">
</div>

<div class="card">
<h2>🎵 Background Music</h2>
<label class="upload">
Choose Music
<input id="musicFile" type="file" accept="audio/*">
</label>
<audio id="music" loop></audio>
<p id="musicStatus">Optional music</p>
</div>

<div class="card">
<h2>📺 Export Quality</h2>
<select id="quality" class="full">
<option value="720">720p HD</option>
<option value="1080" selected>1080p Full HD</option>
<option value="2160">4K Ultra HD</option>
</select>
<button class="full" id="exportBtn" onclick="exportVideo()">
⬇️ EXPORT VIDEO
</button>
<p id="exportStatus">Ready to export</p>
</div>

<canvas id="canvas"></canvas>

<script>
const video=document.getElementById('video');
const file=document.getElementById('file');
const music=document.getElementById('music');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let videoURL=null;
let musicURL=null;
let filterValue='none';
let exporting=false;

function setFilter(value){
 filterValue=value;
 video.style.filter=value;
}

file.onchange=()=>{
 const f=file.files[0];
 if(!f)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;
 document.getElementById('status').textContent=
 'Video loaded successfully!';
 video.onloadedmetadata=()=>{
 document.getElementById('end').value=
 Math.floor(video.duration);
 };
};

document.getElementById('musicFile').onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 if(musicURL)URL.revokeObjectURL(musicURL);
 musicURL=URL.createObjectURL(f);
 music.src=musicURL;
 document.getElementById('musicStatus').textContent=
 'Music loaded successfully!';
};

function drawFrame(){
 if(!exporting)return;

 ctx.filter=filterValue;
 ctx.drawImage(video,0,0,canvas.width,canvas.height);
 ctx.filter='none';

 const caption=document.getElementById('caption').value;
 if(caption){
 ctx.font='bold '+Math.max(24,canvas.width*0.045)+'px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='bottom';
 ctx.lineWidth=3;
 ctx.strokeStyle='black';
 ctx.fillStyle='white';
 ctx.strokeText(caption,canvas.width/2,
 canvas.height-35);
 ctx.fillText(caption,canvas.width/2,
 canvas.height-35);
 }

 if(video.currentTime>=Number(document.getElementById('end').value)){
 video.pause();
}
requestAnimationFrame(drawFrame);
}

async function exportVideo(){
 if(!video.src || !video.videoWidth){
 alert('Please select a video first');
 return;
 }
 if(exporting)return;

 const start=Number(document.getElementById('start').value);
 const end=Number(document.getElementById('end').value);

 if(start<0 || end<=start || end>video.duration){
 alert('Enter valid trim times');
 return;
 }

 if(!window.MediaRecorder || !canvas.captureStream){
 alert('Your browser does not support video export');
 return;
 }

 const height=Number(document.getElementById('quality').value);
 const width=Math.round(
 video.videoWidth*height/video.videoHeight
 );

 if(height===2160 &&
 (width>3840 || !confirm(
 '4K export can use a lot of memory. Continue?'
 ))){
 return;
 }

 canvas.width=width;
 canvas.height=height;

 const mime=[
 'video/webm;codecs=vp9,opus',
 'video/webm;codecs=vp8,opus',
 'video/webm'
 ].find(t=>MediaRecorder.isTypeSupported(t));

 if(!mime){
 alert('WebM export is not supported');
 return;
 }

 const canvasStream=canvas.captureStream(30);
 let tracks=[...canvasStream.getVideoTracks()];

 let sourceStream=null;
 if(video.captureStream){
 sourceStream=video.captureStream();
 }else if(video.mozCaptureStream){
 sourceStream=video.mozCaptureStream();
 }

 if(sourceStream){
 tracks.push(...sourceStream.getAudioTracks());
 }

 let musicStream=null;
 if(music.src && music.captureStream){
 musicStream=music.captureStream();
 tracks.push(...musicStream.getAudioTracks());
 }

 const output=new MediaStream(tracks);
 let chunks=[];

 let recorder;
 try{
 recorder=new MediaRecorder(output,{
 mimeType:mime,
 videoBitsPerSecond:height===2160?18000000:
 height===1080?8000000:5000000
 });
 }catch(e){
 alert('Export setup failed: '+e.message);
 return;
 }

 exporting=true;
 document.getElementById('exportBtn').disabled=true;
 document.getElementById('exportStatus').textContent=
 'Exporting... Please wait';

 recorder.ondataavailable=e=>{
 if(e.data.size)chunks.push(e.data);
 };

 recorder.onerror=()=>{
 exporting=false;
 document.getElementById('exportStatus').textContent=
 'Export failed';
 };

 recorder.onstop=()=>{
 exporting=false;
 const blob=new Blob(chunks,{type:'video/webm'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='Alex-Video-AI.webm';
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),60000);
 document.getElementById('exportStatus').textContent=
 'Export complete! Check your Downloads folder.';
 document.getElementById('exportBtn').disabled=false;
 canvasStream.getTracks().forEach(t=>t.stop());
 };

 try{
 video.pause();
 video.currentTime=start;
 await new Promise(resolve=>{
 video.onseeked=resolve;
 });
 video.playbackRate=Number(document.getElementById('speed').value);

 if(music.src){
 music.currentTime=0;
 await music.play();
 }

 await video.play();
 recorder.start(500);
 drawFrame();

 const finish=()=>{
 if(recorder.state==='recording')recorder.stop();
 video.pause();
 music.pause();
 };
 video.ontimeupdate=()=>{
 if(video.currentTime>=end)finish();
 };
 video.onended=finish;

 }catch(e){
 exporting=false;
 document.getElementById('exportBtn').disabled=false;
 document.getElementById('exportStatus').textContent=
 'Could not start export: '+e.message;
 }
}
</script>
</body>
</html>
